name: build-derper

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "derper version to build (e.g. v1.102.3); empty = Dockerfile default"
        required: false
        default: ""
  schedule:
    # weekly rebuild so `latest` picks up base-image / ca-cert updates
    - cron: "0 3 * * 0"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve derper version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          default="$(sed -n 's/^ARG VERSION=//p' Dockerfile)"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            v="$GITHUB_REF_NAME"
          elif [ -n "$INPUT_VERSION" ]; then
            v="$INPUT_VERSION"
          else
            v="$default"
          fi
          echo "Building derper $v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: gogost/derper
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern=v{{version}}
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
