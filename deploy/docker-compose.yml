# Self-hosted DERP relay + STUN server (docker compose), plain-HTTP mode — no
# TLS, no certs to manage.
#
# derper serves raw HTTP/WebSocket on 8443: a non-443 listen address disables
# its built-in TLS, so clients connect with ws://, not wss://.
#
# Before up:
#   1. docker compose up -d
#   2. Open the firewall for 8443/tcp and 3478/udp.
#
# SECURITY: a plain ws:// relay link is unencrypted and observable in transit,
# and -verify-clients=false runs an OPEN relay (any client that knows the
# address may relay through it). Only run this over a path you trust, and
# encrypt the payload of whatever you carry over it.
#
# TLS in front instead? Chain this same image behind any WebSocket-capable L7
# proxy (Traefik/Caddy/nginx) — nothing here changes.
services:
  derper:
    image: gogost/derper:1.102.3
    container_name: derper
    restart: unless-stopped
    command:
      # Explicit IPv4 bind — a wildcard -a would leave STUN on [::]:3478,
      # unreachable from IPv4 punch probes. Container is non-root, ports stay
      # >1024.
      - -a=0.0.0.0:8443
      - -stun=true
      - -stun-port=3478
      - -verify-clients=false
    ports:
      - "8443:8443/tcp"   # ws://host:8443/derp
      - "3478:3478/udp"   # STUN, for NAT hole punching
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
